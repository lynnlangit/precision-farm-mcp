[project]
name = "mcp-report-export"
version = "0.2.0"
description = "Precision Farm MCP: profitability queries and redacted export"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.13",
    "mcp>=1.0",
    "duckdb>=1.0",
    "pydantic>=2.6",
    "farm-core",
]

[project.scripts]
mcp-report-export = "mcp_report_export.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
farm-core = { path = "../../core", editable = true }
