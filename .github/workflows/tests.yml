name: tests

# Pull-request check: one Ubuntu job, every test that doesn't call the model.
#
# - generator + core: pure Python/DuckDB/file I/O, no Ollama.
# - host tests that don't call the model (MCP servers, routing, the records
#   list, the server pool, the untrusted-field classification):
#   pytest -m "not eval_nl and not ollama".
#
# Not here: the host tests marked `ollama`, the eval_nl suite and the model
# package call a real gemma3:4b. They run in real-model.yml (manual only) or
# on Lynn's Mac before a demo, where Ollama is fast. Windows is not tested in
# CI: growers see the app on Lynn's Mac rather than installing it.
#
# When it runs (kept fast for iterative work on a teaching tool):
# - Pull requests, and on demand (Actions -> tests -> Run workflow). CI does
#   not re-run on the merge to main, which doubled every wait.
# - Docs-only changes (*.md, docs/, images/) skip CI entirely.
on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "images/**"]
  workflow_dispatch:

# A new push to the same PR cancels the run it supersedes.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests, no model (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: generator tests
        run: uv run --project generator pytest -q generator/tests
      - name: generate synthetic data (core tests read it)
        run: uv run --project generator python -m farm_data_gen.cli --seed 42 --out data/synthetic
      - name: core tests
        run: uv run --project core pytest -q core/tests
      - name: confirm both example farms
        run: |
          uv run --project host farm-ingest --auto-approve-synthetic-only
          uv run --project generator python -m farm_data_gen.cli --seed 42 --clean --out data/synthetic-clean
          uv run --project host farm-ingest --auto-approve-synthetic-only --data-dir data/synthetic-clean --confirm-store data/confirmed_mappings_clean.json
      - name: host tests that don't call the model
        run: uv run --project host pytest -q host/tests -m "not eval_nl and not ollama"
