<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-label="Animated terminal cycling through farm-cli's evaluation questions and real answers">
  <rect x="0" y="0" width="1040" height="440" rx="10" fill="#1e1e1e"/>
  <rect x="0" y="0" width="1040" height="34" rx="10" fill="#2d2d2d"/>
  <rect x="0" y="24" width="1040" height="10" fill="#2d2d2d"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="6" fill="#febc2e"/>
  <circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text x="520" y="22" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9b9b9b">farmer@macbook — farm-cli</text>
  <g transform="translate(0,20)">
    
    <g opacity="0">
      <set id="show0" attributeName="opacity" to="1" begin="0s;hide10.begin"/><set id="hide0" attributeName="opacity" to="0" begin="show0.begin+8.4s"/>
      <text x="24" y="66" fill="#7ec1ff" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#28c840">$ </tspan><tspan>farm-cli "Was the Marginal Eighty a bad field or just a bad</tspan><tspan x="24" dy="21">year?"</tspan></text>
      <text x="24" y="128" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan x="24" dy="0">The data shows that the Marginal Eighty field consistently</tspan><tspan x="24" dy="21">experienced high loss rates over the past ten seasons, from</tspan><tspan x="24" dy="21">2016 to 2025.  Specifically, there was a loss rate of 1.0, and</tspan><tspan x="24" dy="21">this poor performance occurred across all those years.</tspan><tspan x="24" dy="21">Therefore, based on this evidence, it appears to be a bad</tspan><tspan x="24" dy="21">field rather than simply a bad year.</tspan></text>
      <text x="24" y="280" fill="#6a6a6a" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12">question 1 of 11</text>
    </g>
    

    <g opacity="0">
      <set id="show1" attributeName="opacity" to="1" begin="hide0.begin"/><set id="hide1" attributeName="opacity" to="0" begin="show1.begin+8.4s"/>
      <text x="24" y="66" fill="#7ec1ff" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#28c840">$ </tspan><tspan>farm-cli "Was East 80 a bad field or just a bad year?"</tspan></text>
      <text x="24" y="107" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan x="24" dy="0">Based on our analysis of East 80 over the past ten seasons,</tspan><tspan x="24" dy="21">the 2020 season produced significantly lower profits compared</tspan><tspan x="24" dy="21">to the median profit of $68.18 per acre. The field itself had</tspan><tspan x="24" dy="21">a negative effect of -7.75, but combined with the seasonal</tspan><tspan x="24" dy="21">impact (-5.16), resulted in an overall residual loss of</tspan><tspan x="24" dy="21">-$89.09 for that year. Therefore, it appears the lower</tspan><tspan x="24" dy="21">performance was primarily due to a bad year rather than</tspan><tspan x="24" dy="21">inherent issues with the East 80 field.</tspan></text>
      <text x="24" y="301" fill="#6a6a6a" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12">question 2 of 11</text>
    </g>
    

    <g opacity="0">
      <set id="show2" attributeName="opacity" to="1" begin="hide1.begin"/><set id="hide2" attributeName="opacity" to="0" begin="show2.begin+8.4s"/>
      <text x="24" y="66" fill="#7ec1ff" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#28c840">$ </tspan><tspan>farm-cli "Was South 160 South a bad field or just a bad year?"</tspan></text>
      <text x="24" y="107" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan x="24" dy="0">South 160 South shows no chronic loss pattern (median</tspan><tspan x="24" dy="21">$175.41/ac) across 6 recorded seasons.</tspan></text>
      <text x="24" y="175" fill="#6a6a6a" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12">question 3 of 11</text>
    </g>
    

    <g opacity="0">
      <set id="show3" attributeName="opacity" to="1" begin="hide2.begin"/><set id="hide3" attributeName="opacity" to="0" begin="show3.begin+8.4s"/>
      <text x="24" y="66" fill="#7ec1ff" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#28c840">$ </tspan><tspan>farm-cli "Which fields made money in the last five years?"</tspan></text>
      <text x="24" y="107" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan x="24" dy="0">Based on the last five years of performance, East 80 made the</tspan><tspan x="24" dy="21">most money with a total profit of $135,533.57. Elevator Forty-</tspan><tspan x="24" dy="21">Depot Forty also performed well, generating a profit of</tspan><tspan x="24" dy="21">$125,093.7. Section Corner and N 80 each had profits of</tspan><tspan x="24" dy="21">$98,104.47 and $66,419.2 respectively.</tspan></text>
      <text x="24" y="238" fill="#6a6a6a" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12">question 4 of 11</text>
    </g>
    

    <g opacity="0">
      <set id="show4" attributeName="opacity" to="1" begin="hide3.begin"/><set id="hide4" attributeName="opacity" to="0" begin="show4.begin+8.4s"/>
      <text x="24" y="66" fill="#7ec1ff" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#28c840">$ </tspan><tspan>farm-cli "Which fields made money in 2019 and 2020?"</tspan></text>
      <text x="24" y="107" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan x="24" dy="0">Here’s an answer for the farmer based on the provided data:</tspan><tspan x="24" dy="21">In 2019 and 2020, Depot Forty made a profit of $17549.90,</tspan><tspan x="24" dy="21">while Home Quarter also showed a profit during those years at</tspan><tspan x="24" dy="21">-$5796.77.  South 160 South and South 160 generated profits of</tspan><tspan x="24" dy="21">$4206.32 and $4830.72 respectively in 2020.</tspan></text>
      <text x="24" y="238" fill="#6a6a6a" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12">question 5 of 11</text>
    </g>
    

    <g opacity="0">
      <set id="show5" attributeName="opacity" to="1" begin="hide4.begin"/><set id="hide5" attributeName="opacity" to="0" begin="show5.begin+8.4s"/>
      <text x="24" y="66" fill="#7ec1ff" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#28c840">$ </tspan><tspan>farm-cli "What does "north eighty" refer to in 2017?"</tspan></text>
      <text x="24" y="107" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan x="24" dy="0">The computed result is available, but a plain-language summary</tspan><tspan x="24" dy="21">could not be verified.</tspan></text>
      <text x="24" y="175" fill="#6a6a6a" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12">question 6 of 11</text>
    </g>
    

    <g opacity="0">
      <set id="show6" attributeName="opacity" to="1" begin="hide5.begin"/><set id="hide6" attributeName="opacity" to="0" begin="show6.begin+8.4s"/>
      <text x="24" y="66" fill="#7ec1ff" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#28c840">$ </tspan><tspan>farm-cli "Do the yield monitor and scale tickets agree on Home</tspan><tspan x="24" dy="21">Quarter in 2019?"</tspan></text>
      <text x="24" y="128" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan x="24" dy="0">The yield monitor and scale tickets do not agree on the Home</tspan><tspan x="24" dy="21">Quarter yield for 2019. The scale recorded 4683.5 bushels,</tspan><tspan x="24" dy="21">while the yield monitor reported 5008.214034934497 bushels.</tspan><tspan x="24" dy="21">This represents a difference of approximately +6.9%.</tspan></text>
      <text x="24" y="238" fill="#6a6a6a" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12">question 7 of 11</text>
    </g>
    

    <g opacity="0">
      <set id="show7" attributeName="opacity" to="1" begin="hide6.begin"/><set id="hide7" attributeName="opacity" to="0" begin="show7.begin+8.4s"/>
      <text x="24" y="66" fill="#7ec1ff" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#28c840">$ </tspan><tspan>farm-cli "Is there anything odd about the yield monitor</tspan><tspan x="24" dy="21">coverage on Marginal Eighty in 2024?"</tspan></text>
      <text x="24" y="128" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan x="24" dy="0">The yield monitor data from Marginal Eighty in 2024 shows a</tspan><tspan x="24" dy="21">slight difference between the reported total yield and the</tspan><tspan x="24" dy="21">yield monitored – 17430.5 bushels versus 17513.57262767709</tspan><tspan x="24" dy="21">bushels.  Notably, there's a coverage gap flagged within the</tspan><tspan x="24" dy="21">monitor data, specifically at one edge of the field. This</tspan><tspan x="24" dy="21">indicates that a simple totals check wouldn’t have identified</tspan><tspan x="24" dy="21">this discrepancy.</tspan></text>
      <text x="24" y="301" fill="#6a6a6a" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12">question 8 of 11</text>
    </g>
    

    <g opacity="0">
      <set id="show8" attributeName="opacity" to="1" begin="hide7.begin"/><set id="hide8" attributeName="opacity" to="0" begin="show8.begin+8.4s"/>
      <text x="24" y="66" fill="#7ec1ff" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#28c840">$ </tspan><tspan>farm-cli "Does the seed cost on Riverside in 2022 look right?"</tspan></text>
      <text x="24" y="107" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan x="24" dy="0">I’m sorry, but the data doesn't show that the seed cost on</tspan><tspan x="24" dy="21">Riverside in 2022 looks right. Records indicate losses</tspan><tspan x="24" dy="21">occurred in 2018, 2019, 2020, 2022 and 2025 out of a total of</tspan><tspan x="24" dy="21">ten seasons.  Therefore, there appears to be an issue with the</tspan><tspan x="24" dy="21">data regarding that specific year.</tspan></text>
      <text x="24" y="238" fill="#6a6a6a" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12">question 9 of 11</text>
    </g>
    

    <g opacity="0">
      <set id="show9" attributeName="opacity" to="1" begin="hide8.begin"/><set id="hide9" attributeName="opacity" to="0" begin="show9.begin+8.4s"/>
      <text x="24" y="66" fill="#7ec1ff" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#28c840">$ </tspan><tspan>farm-cli "What does "Township Rd 12" refer to in 2021?"</tspan></text>
      <text x="24" y="107" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan x="24" dy="0">'Township Rd 12' was not recorded in season 2021 (code:</tspan><tspan x="24" dy="21">not_found)</tspan></text>
      <text x="24" y="175" fill="#6a6a6a" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12">question 10 of 11</text>
    </g>
    

    <g opacity="0">
      <set id="show10" attributeName="opacity" to="1" begin="hide9.begin"/><set id="hide10" attributeName="opacity" to="0" begin="show10.begin+8.4s"/>
      <text x="24" y="66" fill="#7ec1ff" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#28c840">$ </tspan><tspan>farm-cli "Is any part of Section Corner losing money in 2024,</tspan><tspan x="24" dy="21">even though the field overall is profitable?"</tspan></text>
      <text x="24" y="128" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan x="24" dy="0">Based on the data, Section Corner is losing money in 2024.</tspan><tspan x="24" dy="21">Specifically, Zone 0 has a profit of -11943.8. Despite the</tspan><tspan x="24" dy="21">overall field being profitable, this single zone's losses</tspan><tspan x="24" dy="21">outweigh its gains.</tspan></text>
      <text x="24" y="238" fill="#6a6a6a" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12">question 11 of 11</text>
    </g>
    
  </g>
</svg>
