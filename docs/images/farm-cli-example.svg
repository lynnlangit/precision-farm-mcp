<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-label="Terminal showing farm-cli in use">
  <rect x="0" y="0" width="820" height="300" rx="10" fill="#1e1e1e"/>
  <rect x="0" y="0" width="820" height="34" rx="10" fill="#2d2d2d"/>
  <rect x="0" y="24" width="820" height="10" fill="#2d2d2d"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="6" fill="#febc2e"/>
  <circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text x="410" y="22" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#9b9b9b">farmer@macbook — farm-cli</text>

  <g font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="14">
    <text x="20" y="66" fill="#28c840">$</text>
    <text x="36" y="66"><tspan fill="#e8e8e8">farm-cli </tspan><tspan fill="#7ec1ff">"was the north eighty a bad field or a bad year"</tspan></text>

    <text x="20" y="106" fill="#e8e8e8">The North Eighty field was consistently profitable over the past ten</text>
    <text x="20" y="130" fill="#e8e8e8">seasons, with an average profit of $128.72 per acre. There were no</text>
    <text x="20" y="154" fill="#e8e8e8">losses recorded during this time, indicating it wasn't a bad year for</text>
    <text x="20" y="178" fill="#e8e8e8">farming in that area.</text>

    <text x="20" y="218" fill="#28c840">$</text>
    <rect x="34" y="207" width="8" height="16" fill="#e8e8e8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
